<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dusk Village - A 10-player multiplayer social deduction game promoting Media & Information Literacy.">
    <title>Dusk Village</title>
    <style>
        @font-face {
            font-family: 'Dogica';
            src: url('/fonts/dogica.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'DogicaBold';
            src: url('/fonts/dogicabold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'DogicaPixel';
            src: url('/fonts/dogicapixel.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'DogicaPixelBold';
            src: url('/fonts/dogicapixelbold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: block;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0B0E17;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Dogica', 'DogicaPixel', monospace;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .font-preload {
            position: absolute;
            left: -9999px;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="font-preload" style="font-family: 'Dogica';">Preload Dogica</div>
    <div class="font-preload" style="font-family: 'DogicaBold';">Preload DogicaBold</div>
    <div class="font-preload" style="font-family: 'DogicaPixel';">Preload DogicaPixel</div>
    <div class="font-preload" style="font-family: 'DogicaPixelBold';">Preload DogicaPixelBold</div>
    <div id="game-container"></div>
</body>
</html>
